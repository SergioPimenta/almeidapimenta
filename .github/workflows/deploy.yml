name: Deploy to HostGator (FTP)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Build do frontend estático. base = '/' (site na raiz do domínio),
      # então NÃO definimos VITE_BASE_URL aqui.
      - name: Build
        run: npm run build

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.sergiopimenta.com.br
          username: sergioadmin@almeidapimenta.com.br
          # A senha vem de um GitHub Secret — NUNCA coloque a senha aqui.
          # Crie em: Settings > Secrets and variables > Actions > New repository secret
          # Nome: FTP_PASSWORD
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          # Pasta local gerada pelo build (Vite -> dist/)
          local-dir: ./dist/
          # Pasta de destino no servidor, relativa à raiz onde o FTP faz login.
          # Assumindo que a conta FTP entra em /home2/sergi151/ :
          server-dir: /almeidapimenta.com.br/
          # Não apaga arquivos desconhecidos no primeiro deploy.
          dangerous-clean-slate: false
